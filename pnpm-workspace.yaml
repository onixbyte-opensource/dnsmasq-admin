allowBuilds:
  # Prisma's postinstall downloads the query engine binaries and generates the client.
  # Without these two entries pnpm refuses to add packages (ERR_PNPM_IGNORED_BUILDS).
  '@prisma/engines': true
  prisma: true
  # SQLite driver: prisma ships its own binaries, but better-sqlite3 resolved to v12 requires postinstall(prebuild-install)
  # to fetch platform binary.
  better-sqlite3: true
  # esbuild/workerd ship their platform binaries as optionalDependencies, so there is no
  # install script that needs running. Declared explicitly so pnpm stops asking.
  esbuild: false
  workerd: false
  sharp: false
  unrs-resolver: false
